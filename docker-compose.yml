services:
  # ==============================================================================
  # BANCO DE DADOS HÍBRIDO: PostgreSQL 16 + pgvector + PostGIS
  # Suporta dados relacionais (ACID), dados vetoriais (embeddings) e SIG (espacial)
  # ==============================================================================
  db:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.db
    image: caragua-foodtech-db:latest
    container_name: caragua_foodtech_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-caragua_foodtech}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-caragua_foodtech}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - foodtech-network

  # ==============================================================================
  # REDIS: Cache de Sessão, Rate-Limiting e Filas de Mensageria para Scraping Noturno
  # ==============================================================================
  redis:
    image: redis:7-alpine
    container_name: caragua_foodtech_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - foodtech-network

networks:
  foodtech-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
